name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: Build warehouse and run analytics
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Enable LOCAL INFILE
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL local_infile = 1;"

      - name: Run full pipeline
        run: ./run_pipeline.sh -h 127.0.0.1 -uroot -proot

      - name: Gold layer quality checks return no rows
        run: |
          out=$(mysql -h 127.0.0.1 -uroot -proot < tests/quality_check_gold.sql)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Row counts
        run: |
          mysql -h 127.0.0.1 -uroot -proot --table -e "
            SELECT 'gold.dim_customers' AS object, COUNT(*) AS row_count FROM gold.dim_customers
            UNION ALL SELECT 'gold.dim_products', COUNT(*) FROM gold.dim_products
            UNION ALL SELECT 'gold.fact_sales', COUNT(*) FROM gold.fact_sales
            UNION ALL SELECT 'gold.report_customers', COUNT(*) FROM gold.report_customers
            UNION ALL SELECT 'gold.report_products', COUNT(*) FROM gold.report_products;"
